name: ci

on: [push]

env:
  PLAIN_DEBUG: "true"
  PLAIN_SECRET_KEY: testing
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/docs_to_ui

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docs_to_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docs_to_ui"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Lint, format and type check
        run: uv run plain code check
      - name: Design tokens are in sync
        run: uv run python scripts/sync_design.py --check
      - name: Migrations are up to date
        run: uv run plain migrations create --check
      - name: Schema
        run: uv run plain postgres sync
      - name: Preflight
        run: uv run plain preflight
      - name: Unit and integration tests (includes the artifact round-trip)
        run: uv run pytest
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: E2E tests
        run: uv run pytest -m e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (compiles assets)
        run: docker build --target prod -t docs-to-ui:prod .
