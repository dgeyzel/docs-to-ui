# uv workspace root (virtual): the shared d2u library and the two Plain apps.
# Plain resolves its app as ./app, so app commands run inside docs_app/ or
# tuning_app/ (see AGENTS.md §1).
[tool.uv.workspace]
members = ["shared", "docs_app", "tuning_app"]

[dependency-groups]
dev = [
  "plain-code>=0.27.0",
  "plain-dev",
  "plain-pytest",
  "playwright>=1.63.0",
  "pytest-playwright>=0.9.0",
  "pytest-socket>=0.8.1",
]

[tool.plain.code]
# `uv run plain-code check` from the root covers the shared library, scripts,
# shared and E2E tests, and all CSS/JS. Each app is type-checked from its own
# directory, since both apps' packages are named `app` (AGENTS.md §1).
exclude = [
  "design",
  "shared/src/d2u/ui/assets/css/tokens.css",
  "*.md",
  "tests/fixtures",
  "docs_app",
  "tuning_app",
  "tests/docs_app",
  "tests/tuning_app",
]

[tool.plain.code.oxc]
version = "1.84.0"
