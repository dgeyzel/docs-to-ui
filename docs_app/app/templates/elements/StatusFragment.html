<section
    class="card status-panel"
    id="generation-status"
    aria-live="polite"
    hx-get="{{ url('generations:status', id=generation.id) }}"
    hx-trigger="every 2s"
    hx-swap="outerHTML"
>
    <h2 class="card-title">Generation in progress</h2>
    <ol class="stepper">
        {% for step in status.steps %}
        <li class="step step-{{ step.state }}"{% if step.state == "active" %} aria-current="step"{% endif %}>
            <span class="step-number">{% if step.state == "completed" %}✓{% else %}{{ step.number }}{% endif %}</span>
            <span class="step-label">{{ step.label }}</span>
        </li>
        {% endfor %}
    </ol>
    <div class="progress">
        <div class="progress-info">
            <span>{{ status.progress_label }}</span>
            {% if status.total %}<span>{{ status.percent }}%</span>{% endif %}
        </div>
        <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="{{ status.percent }}"
            aria-label="Batch progress"
        >
            <div class="progress-fill" style="width: {{ status.percent }}%"></div>
        </div>
    </div>
</section>
